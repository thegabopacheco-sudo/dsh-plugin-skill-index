# dsh-plugin-skill-index — capa bundle de DSH.
# Inserta una fila @deepseek-ai/dsh-mcp-client que lanza el servidor como "skillsidx".
# Tools resultantes: mcp__skillsidx__* (ver README).
- insert:
    - id: mcp-skill-index
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: skillsidx
        transport: stdio
        command: !!js process.execPath
        args:
          - !!js "(process.env.DSH_HOME && process.env.DSH_HOME.trim() !== '' ? process.env.DSH_HOME : (process.env.USERPROFILE || process.env.HOME || '') + '/.dsh') + '/plugins/skill-index/server.mjs'"
        env:
          ELECTRON_RUN_AS_NODE: '1'
        failOnStartupError: false
        toolCallTimeoutMs: 60000
